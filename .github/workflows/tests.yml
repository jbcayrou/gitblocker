# The suite takes git as its oracle: every supported git is a job, on both
# systems. The versions are built from kernel.org (ci/build-git.sh) and
# cached; `distro` runs a distribution's own git and python, patches
# included, the target of the system-wide install (README). `deb` builds
# the package once (ci/build-deb.sh) and keeps it as the run's artifact;
# `package` replays the life of that very file on each distribution,
# against its git: install, upgrades, remove, purge (ci/test-deb.sh).
#
# A tag `v<VERSION>` runs the same jobs and, when all of them are green,
# `release` attaches that file to a draft release of the tag: the package
# published is the one that was tested, and nothing is public until the
# draft is published by hand.
#
# The Linux runner is named, not `ubuntu-latest`: that label moved to Ubuntu
# 26.04 under the first run of this file, where git 2.39, 2.43 and 2.47 did
# not build and python 3.9 is not offered.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: git ${{ matrix.git }}, ${{ matrix.os }}, python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        git: ["2.39.5", "2.43.7", "2.47.3", "2.50.2", "2.56.1"]
        python: ["3.x"]
        include:
          # The oldest python supported, once: the code is the same on every git.
          - os: ubuntu-24.04
            git: "2.56.1"
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v6
        id: git
        with:
          path: ~/git-${{ matrix.git }}
          key: git-${{ matrix.git }}-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('ci/build-git.sh') }}
      - name: Build git ${{ matrix.git }}
        if: steps.git.outputs.cache-hit != 'true'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -qy libcurl4-openssl-dev libexpat1-dev zlib1g-dev libssl-dev
          fi
          ci/build-git.sh ${{ matrix.git }} ~/git-${{ matrix.git }}
      - name: Tests
        run: |
          export PATH=~/git-${{ matrix.git }}/bin:$PATH
          git --version
          python -m pip install -q pytest
          python -m pytest

  distro:
    name: ${{ matrix.image }} (its git, its python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04", "ubuntu:26.04"]
    container: ${{ matrix.image }}
    steps:
      - run: apt-get update -q && apt-get install -qy git python3 python3-pytest
      - uses: actions/checkout@v7
      # Not as root: root reads every file, and the tests of unreadable
      # paths are skipped for it.
      - name: Tests
        run: |
          id user 2>/dev/null || useradd -m user
          chown -R user .
          su user -c 'git --version && python3 -m pytest'

  deb:
    name: build the .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # A tag that is not the version of the script would publish a package
      # under another number than its own: refused before anything is built.
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 gitblocker.py version | cut -d' ' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but gitblocker.py is version $version: the tag must be v$version"
            exit 1
          fi
      - name: Build
        env:
          # The Maintainer field, when the repository sets one (Settings →
          # Variables); else the default of ci/build-deb.sh.
          DEB_MAINTAINER: ${{ vars.DEB_MAINTAINER }}
        run: |
          deb=$(ci/build-deb.sh dist)
          (cd dist && sha256sum "$(basename "$deb")" > SHA256SUMS && cat SHA256SUMS)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
      - uses: actions/upload-artifact@v7
        with:
          name: gitblocker-deb
          path: dist/
          if-no-files-found: error

  package:
    name: package on ${{ matrix.image }}
    needs: deb
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04", "ubuntu:26.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gitblocker-deb
          path: dist
      # As root, in the job's own container: the script installs and
      # removes git, and says so before doing anything elsewhere.
      - name: Install, upgrade, remove, purge
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          GITBLOCKER_DEB_TEST=throwaway GITBLOCKER_DEB=$(ls "$PWD"/dist/gitblocker_*_all.deb) ci/test-deb.sh

  release:
    name: draft the release of ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [matrix, distro, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gitblocker-deb
          path: dist
      - name: Draft release with the package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "gitblocker ${GITHUB_REF_NAME#v}" --generate-notes \
              dist/gitblocker_*_all.deb dist/SHA256SUMS
